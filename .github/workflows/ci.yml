name: CI

# Standard CI (decision 0015): every PR update runs the full suite, drafts included.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Optimised images from earlier builds (Astro's cache dir). Entries are
      # named by a hash of the source image and transform, so a reused entry
      # is always the right image; the lockfile is in the key because the
      # hash leaves out the sharp and Astro versions. Warmed on main by
      # cache-warm.yml, because PR caches are not shared between PRs.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('astro.config.mjs', 'src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'src/**/*.avif') }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm run --if-present test
      - run: pnpm build
      - run: pnpm check:fonts
      - run: pnpm check:drafts
      - run: pnpm placeholders --fail
