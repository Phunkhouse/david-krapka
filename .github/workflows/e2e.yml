name: E2E

# Adapted from the starter pack's budget-e2e.yml (Budget-conscious, decision 0002).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser_tests:
    # Draft PRs skip cloud validation, like `check` in ci.yml.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Must match the installed @playwright/test version exactly.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Required status check. Skipped with browser_tests on drafts (a draft
  # cannot be merged, and marking it ready runs both); fails otherwise
  # unless browser_tests succeeded.
  playwright:
    needs: [browser_tests]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful browser validation
        env:
          RESULT: ${{ needs.browser_tests.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::Browser validation did not succeed (result: $RESULT)."
            exit 1
          fi
