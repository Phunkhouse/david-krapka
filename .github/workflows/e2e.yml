name: E2E

# Adapted from the starter pack's budget-e2e.yml; Standard CI since decision 0015,
# so every PR update runs it, drafts included.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Must match the installed @playwright/test version exactly.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Optimised images from earlier builds (Astro's cache dir). Entries are
      # named by a hash of the source image and transform, so a reused entry
      # is always the right image; the lockfile is in the key because the
      # hash leaves out the sharp and Astro versions. Warmed on main by
      # cache-warm.yml, because PR caches are not shared between PRs.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('astro.config.mjs', 'src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'src/**/*.avif') }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Required status check: fails unless browser_tests succeeded (including
  # when it was cancelled or skipped).
  playwright:
    needs: [browser_tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful browser validation
        env:
          RESULT: ${{ needs.browser_tests.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::Browser validation did not succeed (result: $RESULT)."
            exit 1
          fi
