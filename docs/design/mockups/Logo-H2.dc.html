<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo H2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&amp;family=Sora:wght@400;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 760px; box-sizing: border-box; padding: 56px; background: #FAFAF7; color: #1B2F7A; font-family: 'Sora', system-ui, sans-serif; display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 48px">
  <svg aria-hidden="true" width="0" height="0" style="position: absolute">
    <defs>
      <pattern id="ht" width="3.2" height="3.2" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.3" fill="#1B2F7A"></circle></pattern>
      <pattern id="htb" width="3.2" height="3.2" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="0.7" fill="#3255A4"></circle></pattern>
      <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#96780A" stop-opacity="0.45"></stop><stop offset="0.3" stop-color="#FFE800" stop-opacity="0"></stop><stop offset="0.7" stop-color="#FFE800" stop-opacity="0"></stop><stop offset="1" stop-color="#96780A" stop-opacity="0.45"></stop></linearGradient>
      <symbol id="big" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#FFE800"></rect><path d="M22 38 L50 66 L78 38" transform="translate(4 4)" stroke="#FF48B0" stroke-width="18" fill="none" stroke-opacity="0.8"></path><path d="M22 38 L50 66 L78 38" stroke="url(#ht)" stroke-width="18" fill="none"></path></symbol>
      <symbol id="fav" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#FFE800"></rect><path d="M22 38 L50 66 L78 38" transform="translate(5 5)" stroke="#FF48B0" stroke-width="20" fill="none"></path><path d="M22 38 L50 66 L78 38" stroke="#1B2F7A" stroke-width="20" fill="none"></path></symbol>
      <symbol id="dark" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#FFE800"></rect><path d="M22 38 L50 66 L78 38" transform="translate(5 5)" stroke="#FF48B0" stroke-width="20" fill="none"></path><path d="M22 38 L50 66 L78 38" stroke="#1B2F7A" stroke-width="20" fill="none"></path></symbol>
    </defs>
  </svg>
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="height: 520px; border: 3px solid #1B2F7A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FAFAF7">
      <svg role="img" aria-label="Logo · H2 háček" width="340" height="340"><use href="#big"></use></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 28px; text-transform: uppercase">Logo · H2 háček</span>
      <span style="font-size: 15px; line-height: 1.5">Blue háček on the yellow paper, pink pass behind. Matches the drum stage and the About circle.</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase">Lockup · light</span>
    <div style="border: 3px solid #1B2F7A; padding: 24px 28px; display: flex; align-items: center; gap: 20px">
      <svg aria-hidden="true" width="80" height="80"><use href="#fav"></use></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 40px; text-transform: uppercase; letter-spacing: -0.02em">David Křapka</span><span style="font-size: 15px; font-weight: 600; margin-top: 4px">Product-minded engineer</span></span>
    </div>
    <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase">Lockup · dark</span>
    <div style="background: #1B2F7A; color: #FAFAF7; padding: 27px 31px; display: flex; align-items: center; gap: 20px">
      <svg aria-hidden="true" width="80" height="80"><use href="#dark"></use></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 40px; text-transform: uppercase; letter-spacing: -0.02em; color: #FFE800">David Křapka</span><span style="font-size: 15px; font-weight: 600; margin-top: 4px">Product-minded engineer</span></span>
    </div>
    <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase">Favicon · real size</span>
    <div style="display: flex; align-items: flex-end; gap: 28px">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg aria-hidden="true" width="64" height="64"><use href="#fav"></use></svg><span style="font-family: 'Space Mono', monospace; font-size: 11px">64</span></span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg aria-hidden="true" width="32" height="32"><use href="#fav"></use></svg><span style="font-family: 'Space Mono', monospace; font-size: 11px">32</span></span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16"><use href="#fav"></use></svg><span style="font-family: 'Space Mono', monospace; font-size: 11px">16</span></span>
      <span style="display: flex; align-items: center; gap: 18px; background: #1B2F7A; padding: 16px 20px; margin-left: 12px; outline: 2px solid #FFE800; outline-offset: -2px"><svg aria-hidden="true" width="32" height="32"><use href="#fav"></use></svg><svg aria-hidden="true" width="16" height="16"><use href="#fav"></use></svg><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #FAFAF7">on dark</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
